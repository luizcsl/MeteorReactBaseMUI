name: CI
on:
  pull_request:
  push:
    branches: [main, master, 'feat/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned Meteor release
        run: |
          curl --fail --show-error --silent 'https://install.meteor.com/?release=3.5.2' -o /tmp/install-meteor.sh
          sh /tmp/install-meteor.sh
          echo "$HOME/.meteor" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Deterministic gates
        run: |
          npm run typecheck
          npm run test:core
          npm run test:toolkit
          npm run boundaries:check
          npm run templates:verify
          npm run docs:verify
      - name: Real Meteor, Mongo, DDP and HTTP security suites
        run: |
          set -o pipefail
          npm run test:security 2>&1 | tee /tmp/security-tests.log
          grep -Eq '[1-9][0-9]* passing' /tmp/security-tests.log
          ! grep -Eq '[1-9][0-9]* failing' /tmp/security-tests.log
      - name: Replica-set transaction port qualification
        run: |
          set -o pipefail
          npm run test:transactions 2>&1 | tee /tmp/transaction-tests.log
          grep -q "replica-set transaction port qualification" /tmp/transaction-tests.log
          grep -Eq "[1-9][0-9]* passing" /tmp/transaction-tests.log
          ! grep -Eq "[1-9][0-9]* failing" /tmp/transaction-tests.log
      - name: Generated module registration, Mongo and DDP qualification
        run: |
          set -o pipefail
          npm run templates:runtime 2>&1 | tee /tmp/template-runtime-tests.log
      - name: Build all application targets
        run: meteor build /tmp/meteor-build --directory
      - name: Dependency vulnerability gates and SBOM
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          mkdir -p .ai-artifacts
          npm sbom --sbom-format cyclonedx --omit=dev > .ai-artifacts/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-test-evidence
          path: |
            /tmp/security-tests.log
            /tmp/transaction-tests.log
            /tmp/template-runtime-tests.log
            .ai-artifacts/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
